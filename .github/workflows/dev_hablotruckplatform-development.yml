name: Build and deploy dotnet core project to Azure Function App - HabloTruckPlatform-development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  FUNCTIONS_PROJECT_PATH: './HabloTruckPlatform/HabloTruckPlatform.Functions/HabloTruckPlatform.Functions.csproj'
  OUTPUT_PATH: './published'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.FUNCTIONS_PROJECT_PATH }}

      - name: Publish
        run: dotnet publish ${{ env.FUNCTIONS_PROJECT_PATH }} --configuration Release --output ${{ env.OUTPUT_PATH }}

      - name: List published files
        run: ls -R ${{ env.OUTPUT_PATH }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'HabloTruckPlatform-development'
          package: '${{ env.OUTPUT_PATH }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3C73A59C14BF4AA887A420E35D2B0889 }}

